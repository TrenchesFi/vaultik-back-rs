[workspace]
members = [
	"crates/indexer-morpho"
]
resolver = "2"

[workspace.package]
version = "1.0.1"
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
app-config = { git = "https://github.com/TrenchesFi/common-rs", tag = "v1.0.1", default-features = false }
common-mem = { git = "https://github.com/TrenchesFi/common-rs", tag = "v1.0.1", default-features = false }

common-evm = { path = "crates/common-evm" }

serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = { version = "=2.0.16", default-features = false }
anyhow = { version = "=1.0.100", default-features = false }

tokio = { version = "=1.48.0", default-features = false, features = ["rt-multi-thread", "macros"] }
async-trait = { version = "=0.1.83", default-features = false }
tokio-stream = { version = "=0.1.17", default-features = false }
tokio-util = { version = "=0.7.16", default-features = false }
async-stream = { version = "=0.3.6", default-features = false }
rand = { version = "=0.10.0-rc.0", default-features = false }
circular-buffer = { version = "=1.2.0", default-features = false }
tracing = { version = "=0.1.41", default-features = false }
tracing-subscriber = { version = "=0.3.20", default-features = false, features = ["env-filter", "fmt"] }
async-nats = { version = "=0.44.2", default-features = false, features = ["server_2_10", "server_2_11", "server_2_12", "aws-lc-rs"] }
prost = { version = "=0.14.1", default-features = false }

alloy = { version = "=1.0.38", default-features = false }
alloy-contract = { version = "=1.0.38", default-features = false }
alloy-eips = { version = "=1.0.38", default-features = false }
alloy-network = { version = "=1.0.38", default-features = false }
alloy-provider = { version = "=1.0.38", default-features = false }
alloy-transport = { version = "=1.0.38", default-features = false }
alloy-rpc-client = { version = "=1.0.38", default-features = false }
alloy-transport-http = { version = "=1.0.38", default-features = false }
alloy-rpc-types-eth = { version = "=1.0.38", default-features = false }
alloy-consensus = { version = "=1.0.38", default-features = false }
alloy-primitives = { version = "=1.4.1", default-features = false }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
strip = "symbols"
lto = "fat"
