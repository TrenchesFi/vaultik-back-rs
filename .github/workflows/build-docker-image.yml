name: Build Docker image

on:
  workflow_dispatch:
    inputs:
      crate:
        description: crate to build
        required: true
      service-name:
        description: Service name
        required: true
      service-tag:
        description: Service tag
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Normalize image name
        id: names
        run: |
          IMAGE_LC="$(echo '${{ inputs.service-name }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_lc=${IMAGE_LC}" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: '.'
          file: './Dockerfile'
          build-args: |
            PACKAGE=${{ inputs.crate }}
          tags: ghcr.io/trenchesfi/vaultik-back-rs-${{ steps.names.outputs.image_lc }}:${{ inputs.service-tag }}
          push: true
